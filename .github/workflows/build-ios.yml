name: Build iOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build without code signing
        run: |
          xcodebuild \
            -project apps/ios/MediaDownloader.xcodeproj \
            -scheme MediaDownloader \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator app
        run: |
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphonesimulator/MediaDownloader.app' -print -quit)"
          test -n "$app_path"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" artifacts/MediaDownloader-iOS-simulator.app.zip

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-iOS-simulator
          path: artifacts/MediaDownloader-iOS-simulator.app.zip
          if-no-files-found: error
          retention-days: 14

  build-unsigned-device:
    name: Build unsigned iPhone/iPad IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Select release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            echo "value=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(python3 -c 'import json;print(json.load(open("version.json"))["main"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned IPA
        env:
          IOS_VERSION: ${{ steps.version.outputs.value }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: bash apps/ios/scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/ios-output"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-iOS-${{ steps.version.outputs.value }}-unsigned
          path: ${{ runner.temp }}/ios-output/*.ipa
          if-no-files-found: error
          retention-days: 30
