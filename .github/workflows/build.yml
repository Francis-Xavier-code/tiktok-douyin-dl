name: Release Windows and Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select release version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows applications
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Package Windows release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist\MediaDownloader-Windows-x64-Setup-$env:APP_VERSION.exe" release-assets\
          Compress-Archive `
            -Path dist\media-downloader.exe `
            -DestinationPath "release-assets\MediaDownloader-Windows-x64-CLI-$env:APP_VERSION.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select release version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Linux CLI binaries
        run: ./scripts/build-linux.sh

      - name: Package Linux release assets
        shell: bash
        run: |
          mkdir -p release-assets
          tar -C dist -czf "release-assets/MediaDownloader-Linux-x86_64-$APP_VERSION.tar.gz" media-downloader
          cp dist/media-downloader release-assets/media-downloader

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="docs/releases/v1.7.0.md"
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --title "MediaDownloader $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "MediaDownloader $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi
