name: Update Star History

# Self-hosted star history chart: fetch the stargazers count daily, append it
# to assets/star-history.json, regenerate assets/star-history.svg and commit
# back to main. README embeds the repo-local SVG, so the chart never depends
# on a flaky third-party service.

on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch & regenerate chart
        run: python3 scripts/update-star-history.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update star history chart"
            git push origin HEAD:main
          else
            echo "No change; nothing to commit."
          fi
